<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 필수: 없으면 env(safe-area-inset-*)이 0이 돼 노치/상태바 영역에 콘텐츠가 비침 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0c0f" />
    <title>AniHy</title>
    <script>
      // Pre-paint theme application — reads the persisted prefs store value
      // (zustand persist JSON) so the first paint already uses the right palette
      try {
        var prefs = JSON.parse(localStorage.getItem('anihy_prefs') || '{}');
        var theme = (prefs.state && prefs.state.theme) || 'system';
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b0c0f' : '#f4f5f7');
      } catch (e) { /* default dark */ }
    </script>
    <!-- Pretendard 웹폰트 (CDN) -->
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
