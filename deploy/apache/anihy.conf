# AniHy (rewritten stack) — Apache conf
# 기존 .apache/anihy.conf (PHP SSR + 쿠키 게이트)를 대체한다.
#
# 구조:
#   /anime/        → web/dist 정적 파일 (React SPA, vite build 산출물)
#   /anime/api/    → FastAPI (uvicorn, http://127.0.0.1:8000/api) 리버스 프록시
#
# 경로 매핑 규약 (중요):
#   FastAPI 라우터는 전부 /api 프리픽스 아래에 마운트돼 있다 (server/main.py).
#   브라우저는 /anime/api/... 로 요청하고, Apache가 /anime 접두사만 떼서
#   백엔드의 /api/... 로 넘긴다:
#     ProxyPass /anime/api http://127.0.0.1:8000/api
#   즉 /anime/api/health → http://127.0.0.1:8000/api/health.
#   미디어(영상/커버/자막)는 직접 정적 노출 없이 FastAPI /api/files/* 경유
#   (인증 쿠키 검사를 서버가 하므로 Apache 차단 불필요).
#
# 설치:
#   sudo a2enmod proxy proxy_http rewrite headers
#   sudo cp deploy/apache/anihy.conf /etc/apache2/conf-available/anihy.conf
#   sudo a2enconf anihy && sudo systemctl reload apache2
#
# 주의: 구 PHP 사이트의 /anime Alias (Alias /anime /var/www/html/anime)와
# 동시에 켜면 충돌한다. 컷오버 전까지는 구 conf를 유지하고, 컷오버 시점에
# 구 conf를 제거(a2disconf 또는 Alias 삭제)한 뒤 이 파일을 활성화할 것.
# staging 검증은 deploy/README.md의 "스테이징 경로" 섹션 참조.

# ── 남아 있는 내부 디렉터리 보호 ────────────────────────────────
# DocumentRoot가 web/dist로 바뀌어도 /var/www/html/anime 아래에는
# downloader/, logs/, sql/, server/, deploy/ 등이 남아 있다.
# (구 PHP의 inc/, worker/ 등은 2026-10 삭제됨)
# 혹시 다른 Alias/설정으로 이 경로가 노출될 경우를 대비해 차단을 유지한다.
<Directory /var/www/html/anime/downloader>
    Require all denied
</Directory>
<Directory /var/www/html/anime/logs>
    Require all denied
</Directory>
<Directory /var/www/html/anime/sql>
    Require all denied
</Directory>
<Directory /var/www/html/anime/server>
    Require all denied
</Directory>
<Directory /var/www/html/anime/deploy>
    Require all denied
</Directory>

# ── API 리버스 프록시 (/anime/api → 127.0.0.1:8000/api) ───────────
# 정적 Alias보다 ProxyPass가 우선하도록 Alias보다 먼저 선언.
# flushpackets=on: SSE 스트림 버퍼링 해제 (필수 — 없으면 이벤트가 뭉개져 도착)
#   대상 SSE 엔드포인트:
#     /api/anidown/episodes (server/routers/admin.py — 회차 목록 스트림)
#     잡 로그 스트리밍 (text/event-stream 응답)
# timeout=1800: 전체 다운로드 ZIP 생성(/api/downloads/bundle) 등 장기 요청용.
#   Apache 기본 ProxyTimeout(60s)이면 ZIP 생성 중 프록시가 끊는다.
ProxyPass /anime/api http://127.0.0.1:8000/api flushpackets=on timeout=1800
ProxyPassReverse /anime/api http://127.0.0.1:8000/api

# SSE 응답에 mod_deflate 등 출력 필터가 끼면 버퍼링된다.
# EventStream은 압축 제외 + 프록시 버퍼 최소화.
<Location /anime/api>
    SetEnvIf Request_URI "/anime/api/anidown/episodes" no-gzip=1
    SetEnvIf Request_URI "/anime/api/jobs/.*/log" no-gzip=1
    # 프록시 IO 버퍼를 작게 — SSE 이벤트가 즉시 flush되도록
    ProxyIOBufferSize 8192
</Location>

# ── SPA 정적 서빙 (/anime → web/dist) ────────────────────────────
Alias /anime /var/www/html/anime/web/dist

<Directory /var/www/html/anime/web/dist>
    Require all granted
    Options -Indexes +FollowSymLinks

    # SPA fallback: 존재하는 파일/디렉터리가 아니고 /anime/api도 아니면
    # index.html로 — React Router(BrowserRouter basename /anime)가 처리.
    RewriteEngine On
    RewriteBase /anime/
    RewriteCond %{REQUEST_URI} ^/anime/api [NC]
    RewriteRule ^ - [L]
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    RewriteRule ^ index.html [L]
</Directory>

# 해시드 정적 자산(vite 산출물 assets/*)만 장기 캐시.
# index.html은 캐시하지 않는다 — 배포마다 내용이 바뀐다.
<LocationMatch "^/anime/assets/.*\.(js|css|woff2?|png|jpg|webp)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
<LocationMatch "^/anime/(index\.html)?$">
    Header set Cache-Control "no-cache"
</LocationMatch>

# 에러 응답 캐시 금지 — 헤더 없는 404/503을 iOS Safari가 휴리스틱 캐시해
# 이후 첫 접속이 캐시된 404로 열리는 사고 방지 (새로고침하면 멀쩡한 증상)
Header always set Cache-Control "no-store" "expr=%{REQUEST_STATUS} >= 400"

# 보안 헤더 (기존 사이트에 없던 것 — 필요 시 조정)
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
