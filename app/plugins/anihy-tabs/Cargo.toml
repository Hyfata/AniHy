[package]
name = "tauri-plugin-anihy-tabs"
version = "0.1.0"
description = "AniHy native tab bar (iOS UITabBar / Android BottomNavigationView)"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-anihy-tabs"
license = "MIT"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
default = []
