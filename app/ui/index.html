<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>AniHy</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0c0f; color: #e7e9ee;
      font-family: -apple-system, 'Pretendard', 'Segoe UI', sans-serif; }
    #root { height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center; }
    .spinner { width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.15); border-top-color: #7c9cff;
      animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #offline { display: none; }
    #offline h1 { font-size: 18px; margin: 0 0 4px; }
    #offline p { font-size: 13px; color: #9aa0ac; margin: 0 0 12px; }
    #retry { background: #7c9cff; color: #0b0c0f; border: 0; border-radius: 10px;
      padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
    /* step 8에서 오프라인 보관함(저장본 목록)이 #downloads 안에 렌더될 예정 */
  </style>
</head>
<body>
  <div id="root">
    <div id="loading">
      <div class="spinner"></div>
      <div style="font-size:13px;color:#9aa0ac">서버에 연결하는 중…</div>
    </div>
    <div id="offline">
      <h1>서버에 연결할 수 없습니다</h1>
      <p>네트워크 상태를 확인한 뒤 다시 시도해 주세요.</p>
      <div id="downloads"></div>
      <button id="retry">다시 시도</button>
    </div>
  </div>
  <script>
    // 번들 부트스트랩: Tauri 코어에서 고정된 서버 URL을 읽어 연결 가능하면
    // 원격 웹(React SPA)으로 교체 로드하고, 실패하면 오프라인 화면을 보인다.
    // 기존 Capacitor server.url + errorPath 조합과 동일한 역할.
    const loading = document.getElementById('loading');
    const offline = document.getElementById('offline');
    const retry = document.getElementById('retry');

    async function serverUrl() {
      const internals = window.__TAURI_INTERNALS__;
      if (internals && typeof internals.invoke === 'function') {
        return await internals.invoke('get_server_url');
      }
      throw new Error('Tauri bridge unavailable');
    }

    async function probe(url) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 5000);
      try {
        // no-cors라도 응답이 오면 네트워크/서버 생존으로 간주
        await fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal });
        return true;
      } catch {
        return false;
      } finally {
        clearTimeout(timer);
      }
    }

    async function boot() {
      loading.style.display = 'flex';
      loading.style.flexDirection = 'column';
      loading.style.alignItems = 'center';
      loading.style.gap = '16px';
      offline.style.display = 'none';
      try {
        const url = await serverUrl();
        if (await probe(url)) {
          window.location.replace(url);
          return;
        }
      } catch (e) {
        // fallthrough
      }
      // 서버 연결 실패 → 번들된 SPA의 오프라인 모드(저장본 보관함/로컬 재생)로 전환.
      // app/scripts/sync-web.sh가 web 빌드 산출물을 ui/spa/에 복사해 둔다.
      try {
        await fetch('./spa/index.html', { cache: 'no-store' });
        window.location.replace('./spa/index.html#offline=1');
        return;
      } catch (e) {
        // SPA 미번들 — 아래 정적 오프라인 화면으로 폴팩
      }
      loading.style.display = 'none';
      offline.style.display = 'block';
    }

    retry.addEventListener('click', boot);
    window.addEventListener('online', boot);
    boot();
  </script>
</body>
</html>
